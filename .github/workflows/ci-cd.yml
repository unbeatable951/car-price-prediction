# ============================================================
# .github/workflows/ci-cd.yml
# ============================================================
# Runs automatically on every push/PR to main: lints the code, runs
# the full pytest suite, and (only on pushes to main) builds the
# Docker image to catch build-breaking changes before they reach
# Render's own build step.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Lint with flake8
        run: flake8 src app config.py --max-line-length=120 --extend-ignore=E203,W503,F401,E501,W291,W293,E302,E402,W292

      - name: Run Black formatter
        run: black --line-length=120 src app config.py

      - name: Run isort formatter
        run: isort --profile black --line-length=120 src app config.py

      - name: Run pytest suite
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t car-price-prediction:ci-test .

      - name: Confirm image runs and responds
        run: |
          docker run -d -p 5000:5000 -e PORT=5000 --name ci-test-container car-price-prediction:ci-test
          sleep 10
          curl -f http://localhost:5000/health || (docker logs ci-test-container && exit 1)
          docker stop ci-test-container